    --line: #23232a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 14px;
    line-height: 1.55;
    min-height: 100vh;
  }
  .wrap {

    margin: 0 auto;
    padding: 48px 24px 96px;

    padding-bottom: 18px;
    margin-bottom: 40px;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: 0.02em;
  }
  .sigil { color: var(--accent); }
  .sub { color: var(--dim); font-size: 12px; }
  nav {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-top: 32px;
  }
  @media (max-width: 560px) {
    nav { grid-template-columns: 1fr; }
  }
  a.card {
    display: block;
    padding: 24px 22px;
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--fg);
    text-decoration: none;
    transition: border-color 120ms, background 120ms;
  }
  a.card:hover {
    border-color: var(--accent);
    background: #111117;
  }
  a.card .tag {
    color: var(--accent);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 10px;
  }
  a.card .name {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  a.card .desc {
    color: var(--dim);
    font-size: 12px;
    line-height: 1.5;
  }
  footer {
    margin-top: 64px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    color: var(--dim);
    font-size: 11px;
    letter-spacing: 0.06em;
  }
  .rule {
    color: var(--dim);
    margin: 8px 0 0;
    font-size: 11px;
  }
</style>
