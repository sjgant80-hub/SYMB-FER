<script>
// Minimal markdown renderer tuned for this audit file.
// No deps. Handles: fenced code, # / ##, inline code, simple paragraphs.
function renderMarkdown(src) {
  var out = [];
  var lines = src.split(/\r?\n/);
  var inFence = false;
  var buf = [];

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function flush() {
    if (buf.length) {
      out.push('<p>' + buf.join('<br>') + '</p>');
      buf = [];
    }
  }

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (/^```/.test(line)) {
      if (!inFence) {
        flush();
        inFence = true;
        out.push('<pre>');
      } else {
        inFence = false;
        out.push('</pre>');
      }
      continue;
    }
    if (inFence) {
      out.push(esc(line));
      continue;
    }
    if (/^#\s+/.test(line)) {
      flush();
      out.push('<h1>' + esc(line.replace(/^#\s+/, '')) + '</h1>');
      continue;
    }
    if (/^##\s+/.test(line)) {
      flush();
      var txt = line.replace(/^##\s+/, '');
      var cls = '';
      if (/SEV:HIGH/.test(txt)) cls = 'sev-high';
      else if (/SEV:MED/.test(txt)) cls = 'sev-med';
      else if (/SEV:LOW/.test(txt)) cls = 'sev-low';
      else if (/SEV:INFO/.test(txt)) cls = 'sev-info';
      out.push('<h2' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(txt) + '</h2>');
      continue;
    }
    if (line.trim() === '') {
      flush();
      continue;
    }
    // inline `code`
    var html = esc(line).replace(/`([^`]+)`/g, '<code>$1</code>');
    buf.push(html);
  }
  flush();
  return out.join('\n');
}
